<!DOCTYPE html>
<html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ART</title>
     <!-- GOOGLE FONTS SPECIAL ELITE -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
      <header class="header-principal">
          <div class="logo">
             <img src="imagenes/LGW.jpg.jpeg" alt="logo" class="logoAinhoa">
         </div>
         <div class="titulo-pagina-header">
             <h2>Datos de contacto</h2>
         </div>
         <nav class="menu-central">
             <a href="index.html" class="nav-item">Home</a>
             <a href="gallery.html" class="nav-item">Galería</a>
          </nav>
      </header>
      <div class="contenedor-contacto">
         <main class="zona-formulario">
             <div class="info-mail-directo">
                 <p class="banner-negro">Contactáme a través de:</p>
                 <p class="banner-negro">
                     <a href="#" class="mail">
                         <i class="fa-solid fa-envelope"></i>
                     </a>
                     Mail:ainhoareategui@gmail.com
                 </p> 
             </div>
              <form class="formulario-registro">
                 <div class="fila-input-inline">
                     <span class="label-fija-correo">Correo:</span>
                     <input type="text" placeholder="Nombre" class="input-estilo">
                     <input type="text" placeholder="Apellidos" class="input-estilo">
                 </div>
                 <input type="text" placeholder="Empresa" class="input-estilo campo-ancho">
                 <p class="nota-aclaratoria">*Elegir entre estos dos campos</p>
                 <textarea placeholder="Escribir motivo/asunto" class="textarea-estilo"></textarea>
                 <div class="botones-formulario">
                     <button type="submit" class="btn-enviar">Enviar</button>
                     <button type="reset" class="btn-borrar">Borrar</button>
                 </div>
                 <p class="aviso-confidencialidad">*Aviso: esta información será unicamente utilizada de manera confidencial.</p>
            </main>
            <aside class="zona-redes">
                <div class="instagram-box">Instagram</div>
                <div class="qr-placeholder">QR</div>
            </aside>
     </div>
     <footer class="pie-de-pagina">
         <div class="footer-izquierda">
             <a href="#" class="closefooter">
                 <i class="fa-solid fa-rectangle-xmark"></i>
             </a>
             <div class="footerlinks">
                 <a href="index.html">Home</a>
                 <a href="gallery.html">Galería</a>
             </div>
         </div>
         <div class="footer-derecho">
             <a href="#"> Política de cookies</a>
             <a href="#"> Política de privacidad</a>
         </div>
     </footer> 
  </body> 
</html>
